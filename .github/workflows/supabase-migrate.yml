name: Ripara database Supabase

# Applica le migrazioni correttive al database di produzione usando la
# Management API di Supabase via HTTPS, invece di una connessione
# Postgres diretta.
#
# Perche' questo cambio: la connessione diretta (porta 5432) su questo
# progetto e' raggiungibile solo via IPv6, che i runner di GitHub Actions
# non supportano in uscita ("Network is unreachable"). Il pooler IPv4
# (Supavisor) non e' disponibile per questo progetto: ogni indirizzo
# provato restituisce "tenant not found", e la finestra "Connect to your
# project" di Supabase non offre un'alternativa col pooler per questo
# account. La Management API gira invece su normale HTTPS (porta 443),
# che i runner raggiungono senza problemi, ed espone un endpoint per
# eseguire SQL sul database del progetto.
#
# Richiede il secret SUPABASE_ACCESS_TOKEN: un Personal Access Token
# generato da supabase.com/dashboard/account/tokens (diverso dalla
# password del database).
#
# Vengono eseguite solo le migrazioni 013+ perche' sono scritte per essere
# idempotenti e ripetibili; le precedenti descrivono lo schema iniziale e
# rieseguirle su un database gia' popolato fallirebbe.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/01[3-9]_*.sql'
      - 'supabase/migrations/0[2-9][0-9]_*.sql'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

env:
  # Riferimento del progetto Supabase: e' lo stesso valore gia' pubblico
  # nel codice del frontend (VITE_SUPABASE_URL), non e' un segreto.
  PROJECT_REF: sncwrzrzlorzfnfnaxin

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Applica le migrazioni correttive via Management API
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Manca il secret SUPABASE_ACCESS_TOKEN."
            echo "Generane uno su supabase.com/dashboard/account/tokens e impostalo in Settings > Secrets and variables > Actions."
            exit 1
          fi

          fallite=0
          for f in $(ls supabase/migrations/*.sql | sort | awk -F/ '$NF >= "013"'); do
            echo "::group::$f"
            # Il file va incapsulato in un JSON valido (jq -Rs gestisce
            # a capo e virgolette senza bisogno di escape manuale).
            payload=$(jq -n --rawfile sql "$f" '{query: $sql}')
            risposta=$(curl -sS -w '\n%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            corpo=$(echo "$risposta" | sed '$d')
            stato=$(echo "$risposta" | tail -1)
            if [ "$stato" -ge 200 ] && [ "$stato" -lt 300 ]; then
              echo "OK: $f"
            else
              echo "::error::Fallita: $f (HTTP $stato)"
              echo "$corpo"
              fallite=$((fallite + 1))
            fi
            echo "::endgroup::"
          done

          if [ "$fallite" -gt 0 ]; then
            echo "::error::$fallite migrazioni non applicate: vedi i log sopra."
            exit 1
          fi
          echo "Tutte le migrazioni correttive sono state applicate."

      - name: Verifica finale
        if: always()
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          verifica() {
            curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" '{query: $q}')"
            echo
          }
          echo "== Tabella movimenti =="
          verifica "SELECT count(*) FROM movimenti;"
          echo "== Stati appuntamento disponibili =="
          verifica "SELECT unnest(enum_range(NULL::stato_appuntamento));"
          echo "== Colonne reali di utenti =="
          verifica "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='utenti' ORDER BY ordinal_position;"
          echo "== Tipo reale della colonna appuntamenti.stato =="
          verifica "SELECT column_name, data_type, udt_name FROM information_schema.columns WHERE table_name='appuntamenti' AND column_name='stato';"
          echo "== Tipi enum esistenti nel database =="
          verifica "SELECT typname FROM pg_type WHERE typtype='e';"

